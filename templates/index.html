<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stoppuhr</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Stoppuhr</h1>
<div id="timer">0.00</div>

<button id="startBtn">Start</button>
<button id="stopBtn">Stop</button>
<button id="lapBtn">Lap</button>
<button id="resetBtn">Reset</button>

<div id="laps"></div>

<script>
let timerInterval = null;
let startTime = null;
let elapsed = 0;
let lapCount = 0;

function updateTimer() {
    document.getElementById("timer").innerText = elapsed.toFixed(2);
}

function startTimer() {
    if (!timerInterval) {
        startTime = Date.now() - elapsed * 1000;
        timerInterval = setInterval(() => {
            elapsed = (Date.now() - startTime) / 1000;
            updateTimer();
        }, 10);
    }
}

function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

function lapTimer() {
    if (!timerInterval) return;
    lapCount += 1;
    const lapDiv = document.getElementById("laps");
    const p = document.createElement("p");
    p.innerText = `Lap ${lapCount}: ${elapsed.toFixed(2)} s`;
    lapDiv.appendChild(p);
}

function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    elapsed = 0;
    lapCount = 0;
    updateTimer();
    startTime = null;
    document.getElementById("laps").innerHTML = '';
}

document.getElementById("startBtn").onclick = startTimer;
document.getElementById("stopBtn").onclick = stopTimer;
document.getElementById("lapBtn").onclick = lapTimer;
document.getElementById("resetBtn").onclick = resetTimer;
</script>
</body>
</html>
