<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Miami Vice Stoppuhr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-wrapper">
    <div class="card">
        <h1>Miami Vice Stoppuhr</h1>

        <div id="timer">00:00.00</div>

        <div class="button-row">
            <button id="startBtn" class="btn primary">Start</button>
            <button id="stopBtn" class="btn danger">Stop</button>
        </div>
        <div class="button-row">
            <button id="lapBtn" class="btn secondary">Lap</button>
            <button id="resetBtn" class="btn ghost">Reset</button>
        </div>

        <div class="laps-container">
            <div class="laps-header">
                <span>Lap</span>
                <span>Zeit</span>
                <span>Diff</span>
            </div>
            <div id="laps" class="laps-list"></div>
        </div>
    </div>
</div>

<script>
let timerInterval = null;
let startTime = null;
let elapsed = 0;
let lapCount = 0;
let lastLapTime = 0;

function formatTime(t) {
    const minutes = Math.floor(t / 60);
    const seconds = Math.floor(t % 60);
    const hundredths = Math.floor((t * 100) % 100);
    return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${String(hundredths).padStart(2, "0")}`;
}

function updateTimer() {
    document.getElementById("timer").innerText = formatTime(elapsed);
}

function startTimer() {
    if (!timerInterval) {
        startTime = Date.now() - elapsed * 1000;
        timerInterval = setInterval(() => {
            elapsed = (Date.now() - startTime) / 1000;
            updateTimer();
        }, 10);
    }
}

function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

function lapTimer() {
    if (!timerInterval) return;
    lapCount += 1;

    const lapsContainer = document.getElementById("laps");
    const lapTime = elapsed;
    const diff = lapTime - lastLapTime;
    lastLapTime = lapTime;

    const row = document.createElement("div");
    row.className = "lap-row";

    const numSpan = document.createElement("span");
    numSpan.textContent = lapCount.toString().padStart(2, "0");

    const timeSpan = document.createElement("span");
    timeSpan.textContent = formatTime(lapTime);

    const diffSpan = document.createElement("span");
    diffSpan.textContent = "+" + formatTime(diff);

    row.appendChild(numSpan);
    row.appendChild(timeSpan);
    row.appendChild(diffSpan);

    lapsContainer.prepend(row);
}

function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    elapsed = 0;
    lapCount = 0;
    lastLapTime = 0;
    updateTimer();
    startTime = null;
    document.getElementById("laps").innerHTML = '';
}

document.getElementById("startBtn").onclick = startTimer;
document.getElementById("stopBtn").onclick = stopTimer;
document.getElementById("lapBtn").onclick = lapTimer;
document.getElementById("resetBtn").onclick = resetTimer;

updateTimer();
</script>
</body>
</html>
