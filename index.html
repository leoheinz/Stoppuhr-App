<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stoppuhr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-wrapper">
    <div class="card">
        <h1>Stoppuhr</h1>

        <div id="timer">0.00</div>

        <div class="button-row">
            <button id="startBtn" class="btn primary">Start</button>
            <button id="stopBtn" class="btn danger">Stop</button>
            <button id="lapBtn" class="btn secondary">Lap</button>
            <button id="resetBtn" class="btn ghost">Reset</button>
        </div>

        <div class="laps-container">
            <div class="laps-header">
                <span>#</span>
                <span>Zeit (s)</span>
            </div>
            <div id="laps" class="laps-list"></div>
        </div>
    </div>
</div>

<script>
let timerInterval = null;
let startTime = null;
let elapsed = 0;
let lapCount = 0;

function updateTimer() {
    document.getElementById("timer").innerText = elapsed.toFixed(2);
}

function startTimer() {
    if (!timerInterval) {
        startTime = Date.now() - elapsed * 1000;
        timerInterval = setInterval(() => {
            elapsed = (Date.now() - startTime) / 1000;
            updateTimer();
        }, 10);
    }
}

function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

function lapTimer() {
    if (!timerInterval) return;
    lapCount += 1;
    const lapsContainer = document.getElementById("laps");

    const row = document.createElement("div");
    row.className = "lap-row";

    const numSpan = document.createElement("span");
    numSpan.textContent = lapCount.toString().padStart(2, "0");

    const timeSpan = document.createElement("span");
    timeSpan.textContent = elapsed.toFixed(2);

    row.appendChild(numSpan);
    row.appendChild(timeSpan);
    lapsContainer.prepend(row); // neueste Lap oben
}

function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    elapsed = 0;
    lapCount = 0;
    updateTimer();
    startTime = null;
    document.getElementById("laps").innerHTML = '';
}

document.getElementById("startBtn").onclick = startTimer;
document.getElementById("stopBtn").onclick = stopTimer;
document.getElementById("lapBtn").onclick = lapTimer;
document.getElementById("resetBtn").onclick = resetTimer;

// Initial anzeigen
updateTimer();
</script>
</body>
</html>
