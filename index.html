<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Stoppuhr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-wrapper">
    <div class="card">
        <header class="header">
            <div class="header-title">Stoppuhr</div>
        </header>

        <main class="content">
            <div id="timer" class="time-display">00:00.00</div>

            <div class="button-row">
                <button id="resetBtn" class="btn btn-secondary">Zurücksetzen</button>
                <button id="startBtn" class="btn btn-primary">Start</button>
            </div>

            <div class="laps-container">
                <div class="laps-header">
                    <span>Runde</span>
                    <span>Rundenzeit</span>
                    <span>Gesamt</span>
                </div>
                <div id="laps" class="laps-list"></div>
            </div>
        </main>
    </div>
</div>

<script>
let timerInterval = null;
let startTime = null;
let elapsed = 0;
let lapCount = 0;
let lastLapTime = 0;
let running = false;

function formatTime(t) {
    const minutes = Math.floor(t / 60);
    const seconds = Math.floor(t % 60);
    const hundredths = Math.floor((t * 100) % 100);
    return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${String(hundredths).padStart(2, "0")}`;
}

function updateTimer() {
    document.getElementById("timer").innerText = formatTime(elapsed);
}

function startTimer() {
    if (running) return;
    running = true;
    const startBtn = document.getElementById("startBtn");
    startBtn.textContent = "Stopp";
    startBtn.classList.remove("btn-primary");
    startBtn.classList.add("btn-danger");

    if (!timerInterval) {
        startTime = Date.now() - elapsed * 1000;
        timerInterval = setInterval(() => {
            elapsed = (Date.now() - startTime) / 1000;
            updateTimer();
        }, 10);
    }
}

function stopTimer() {
    if (!running) return;
    running = false;
    const startBtn = document.getElementById("startBtn");
    startBtn.textContent = "Start";
    startBtn.classList.remove("btn-danger");
    startBtn.classList.add("btn-primary");

    clearInterval(timerInterval);
    timerInterval = null;
}

function toggleStartStop() {
    if (running) {
        stopTimer();
    } else {
        startTimer();
    }
}

function lapTimer() {
    if (!running) return;

    lapCount += 1;

    const lapsContainer = document.getElementById("laps");
    const lapTime = elapsed;
    const diff = lapTime - lastLapTime;
    lastLapTime = lapTime;

    const row = document.createElement("div");
    row.className = "lap-row";

    const numSpan = document.createElement("span");
    numSpan.textContent = `Runde ${lapCount}`;

    const lapSpan = document.createElement("span");
    lapSpan.textContent = formatTime(diff);

    const totalSpan = document.createElement("span");
    totalSpan.textContent = formatTime(lapTime);

    row.appendChild(numSpan);
    row.appendChild(lapSpan);
    row.appendChild(totalSpan);

    lapsContainer.prepend(row);
}

function resetTimer() {
    if (running) {
        // Wenn laufend: iOS macht hier "Runde" statt "Reset" – wir bleiben aber bei Reset nur im Stopp-Zustand
        lapTimer();
        return;
    }
    elapsed = 0;
    lapCount = 0;
    lastLapTime = 0;
    updateTimer();
    document.getElementById("laps").innerHTML = '';
}

document.getElementById("startBtn").onclick = toggleStartStop;
document.getElementById("resetBtn").onclick = resetTimer;

// Optional: Doppeltippen auf Zeit = Runde (wie iOS-Gesten-Feeling, aber frei erfunden)
document.getElementById("timer").ondblclick = lapTimer;

updateTimer();
</script>
</body>
</html>
