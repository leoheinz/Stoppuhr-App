<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Stoppuhr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-wrapper">
    <div class="card">
        <header class="header">
            <div class="header-title">Stoppuhr</div>
        </header>

        <main class="content">
            <div id="timer" class="time-display">00:00.00</div>

            <div class="button-row">
                <button id="leftBtn" class="btn btn-secondary" disabled>Zurücksetzen</button>
                <button id="rightBtn" class="btn btn-primary">Start</button>
            </div>

            <div class="laps-container">
                <div class="laps-header">
                    <span>Runde</span>
                    <span>Rundenzeit</span>
                    <span>Gesamt</span>
                </div>
                <div id="laps" class="laps-list"></div>
            </div>
        </main>
    </div>
</div>

<script>
let timerInterval = null;
let startTime = null;
let elapsed = 0;
let running = false;

let laps = []; // {index, lapTime, totalTime}
let lastLapTotal = 0;

function formatTime(t) {
    const minutes = Math.floor(t / 60);
    const seconds = Math.floor(t % 60);
    const hundredths = Math.floor((t * 100) % 100);
    return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${String(hundredths).padStart(2, "0")}`;
}

function updateTimer() {
    document.getElementById("timer").innerText = formatTime(elapsed);
}

function startTimer() {
    if (running) return;
    running = true;

    const rightBtn = document.getElementById("rightBtn");
    const leftBtn = document.getElementById("leftBtn");

    rightBtn.textContent = "Stopp";
    rightBtn.classList.remove("btn-primary");
    rightBtn.classList.add("btn-danger");

    leftBtn.textContent = "Runde";
    leftBtn.disabled = false;

    if (!timerInterval) {
        startTime = Date.now() - elapsed * 1000;
        timerInterval = setInterval(() => {
            elapsed = (Date.now() - startTime) / 1000;
            updateTimer();
        }, 10);
    }
}

function stopTimer() {
    if (!running) return;
    running = false;

    const rightBtn = document.getElementById("rightBtn");
    const leftBtn = document.getElementById("leftBtn");

    rightBtn.textContent = "Start";
    rightBtn.classList.remove("btn-danger");
    rightBtn.classList.add("btn-primary");

    leftBtn.textContent = "Zurücksetzen";
    leftBtn.disabled = false;

    clearInterval(timerInterval);
    timerInterval = null;
}

function toggleStartStop() {
    if (running) {
        stopTimer();
    } else {
        startTimer();
    }
}

function addLap() {
    const totalTime = elapsed;
    const lapTime = totalTime - lastLapTotal;
    lastLapTotal = totalTime;

    const index = laps.length + 1;
    laps.push({ index, lapTime, totalTime });

    renderLaps();
}

function resetAll() {
    elapsed = 0;
    running = false;
    laps = [];
    lastLapTotal = 0;
    updateTimer();
    renderLaps();

    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");

    leftBtn.textContent = "Zurücksetzen";
    leftBtn.disabled = true;

    rightBtn.textContent = "Start";
    rightBtn.classList.remove("btn-danger");
    rightBtn.classList.add("btn-primary");

    clearInterval(timerInterval);
    timerInterval = null;
}

function handleLeftButton() {
    if (running) {
        // iOS: wenn läuft → Runde
        addLap();
    } else {
        // iOS: wenn gestoppt → Zurücksetzen
        resetAll();
    }
}

function renderLaps() {
    const lapsContainer = document.getElementById("laps");
    lapsContainer.innerHTML = "";

    if (laps.length === 0) return;

    // schnellste & langsamste Runde bestimmen (nur wenn mehr als 1)
    let minLap = Infinity;
    let maxLap = -Infinity;
    if (laps.length > 1) {
        laps.forEach(l => {
            if (l.lapTime < minLap) minLap = l.lapTime;
            if (l.lapTime > maxLap) maxLap = l.lapTime;
        });
    }

    // neueste Runde oben anzeigen
    [...laps].reverse().forEach(lap => {
        const row = document.createElement("div");
        row.className = "lap-row";

        const numSpan = document.createElement("span");
        numSpan.textContent = `Runde ${lap.index}`;

        const lapSpan = document.createElement("span");
        lapSpan.textContent = formatTime(lap.lapTime);

        const totalSpan = document.createElement("span");
        totalSpan.textContent = formatTime(lap.totalTime);

        // Farben wie iOS: schnellste grün, langsamste rot
        if (laps.length > 1) {
            if (lap.lapTime === minLap) {
                lapSpan.classList.add("lap-fastest");
            } else if (lap.lapTime === maxLap) {
                lapSpan.classList.add("lap-slowest");
            }
        }

        row.appendChild(numSpan);
        row.appendChild(lapSpan);
        row.appendChild(totalSpan);

        lapsContainer.appendChild(row);
    });
}

document.getElementById("rightBtn").onclick = toggleStartStop;
document.getElementById("leftBtn").onclick = handleLeftButton;

// Optional: Doppeltipp auf die Zeit = Runde (nur wenn läuft)
document.getElementById("timer").ondblclick = () => {
    if (running) addLap();
};

updateTimer();
</script>
</body>
</html>
